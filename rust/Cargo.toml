[package]
name = "rustbx"
version = "0.0.1"
edition = "2021"
description = "Brain extraction tool using ONNX Runtime"

[dependencies]
nifti = { version = "0.17", features = ["ndarray_volumes"] }
ndarray = { version = "0.16", features = ["rayon"] }
ort = { version = "=2.0.0-rc.11", default-features = false, features = ["std", "ndarray", "load-dynamic"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
glob = "0.3"
rayon = "1"
flate2 = "1"
