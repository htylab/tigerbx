name: Compile10

# Release executables: tigerbx (Linux, macOS, Windows) from exe.yml, attached to a draft release.

on:
  push:
    tags: ['v*']       # pushing a release tag builds it and creates a draft release for that tag
  workflow_dispatch:
    inputs:
      make_release:
        description: "Create a draft GitHub Release with the zips"
        type: boolean
        default: true

permissions:
  contents: write      # 建立 Release 需要

jobs:
# ============================================================
# 1. exe ── tigerbx 執行檔（exe.yml，Rust），三大 OS 的 zip
# ============================================================
  exe:
    uses: ./.github/workflows/exe.yml

# ============================================================
# 2. Release ── 收集 zip 直接發布
# ============================================================
  release:
    needs: exe
    if: ${{ github.event_name == 'push' || inputs.make_release }}
    runs-on: ubuntu-latest

    steps:
    - name: Download all build artifacts
      uses: actions/download-artifact@v4
      with:
        merge-multiple: true
        path: release

    - name: List downloaded files
      run: ls -lh release/

    - name: Create draft GitHub Release
      uses: ncipollo/release-action@v1
      with:
        tag: ${{ github.event_name == 'push' && github.ref_name || format('v{0}', github.run_number) }}
        name: ${{ github.event_name == 'push' && github.ref_name || format('Release {0}', github.run_number) }}
        draft: true
        artifacts: release/*.zip
        token: ${{ secrets.GITHUB_TOKEN }}
